services:
  - type: web
    name: ban6800-retail-api
    runtime: python
    plan: free
    branch: final-project
    buildCommand: pip install -r deployment/requirements.txt && python -m pytest deployment/test_cloud_api.py -q
    startCommand: uvicorn deployment.cloud_api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
    autoDeployTrigger: off
