name: Final project API and monitoring
on:
  push:
    branches: [final-project]
  pull_request:
    branches: [final-project]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-and-monitoring:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deployment/requirements.txt
      - name: Install API and testing dependencies
        run: pip install -r deployment/requirements.txt
      - name: Verify model parity and monitoring boundaries
        run: python -m pytest deployment/test_cloud_api.py -q
      - name: Build deployable API image
        run: docker build -f deployment/Dockerfile -t ban6800-api:ci .
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-test-only-not-a-real-credential
        run: docker compose config --quiet
      - name: Start multi-container monitoring stack
        env:
          GRAFANA_ADMIN_PASSWORD: ci-test-only-not-a-real-credential
        run: docker compose up --build -d api prometheus grafana
      - name: Verify running services
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/health
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:9090/-/ready
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:8000/monitoring/data
      - name: Stop CI containers
        if: always()
        env:
          GRAFANA_ADMIN_PASSWORD: ci-test-only-not-a-real-credential
        run: docker compose down --volumes
