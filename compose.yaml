services:
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_PATH: /tmp/ban6800/api.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting Compose}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
  pipeline:
    profiles: [prepare]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--source", "/source/m5-forecasting-accuracy.zip"]
    volumes:
      - type: bind
        source: ${M5_SOURCE_DIR:-./data/raw}
        target: /source
        read_only: true
      - prepared-data:/app/data/processed
volumes:
  prometheus-data:
  grafana-data:
  prepared-data:
